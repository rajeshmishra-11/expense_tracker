<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">Expense Tracker</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('add_expense') }}">Add Expense</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('compare_expenses') }}">Compare Expenses</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-danger text-white" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <h2 class="text-center text-primary">Compare Monthly Expenses</h2>

    <!-- Form to Select Two Months -->
    <div class="card shadow p-4">
        <form method="POST" class="row g-3">
            <div class="col-md-4">
                <label for="month1" class="form-label">First Month:</label>
                <input type="month" class="form-control" name="month1" required>
            </div>

            <div class="col-md-4">
                <label for="month2" class="form-label">Second Month:</label>
                <input type="month" class="form-control" name="month2" required>
            </div>

            <div class="col-md-4 text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg w-100">Compare</button>
            </div>
        </form>
    </div>


        <!-- Expense Comparison Chart -->
        {% if labels %}
        <div class="card shadow mt-4 p-4">
            <h3 class="text-center text-success">Comparison: {{ month1 }} vs {{ month2 }}</h3>
            <canvas id="expenseChart"></canvas>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var ctx = document.getElementById('expenseChart').getContext('2d');
                var expenseChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: {{ labels | tojson }},
                        datasets: [
                            {
                                label: "{{ month1 }}",
                                data: {{ data1 | tojson }},
                                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            },
                            {
                                label: "{{ month2 }}",
                                data: {{ data2 | tojson }},
                                backgroundColor: 'rgba(255, 99, 132, 0.6)',
                                borderColor: 'rgba(255, 99, 132, 1)',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            });
        </script>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
