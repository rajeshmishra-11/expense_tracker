<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Update Expense</h2>

        <form method="POST">
            <div class="row">
                <!-- Date Field -->
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" value="{{ expense[2] }}" required>
                </div>

                <!-- Category Field -->
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" name="category" class="form-control" value="{{ expense[3] }}" required>
                </div>
            </div>

            <div class="row">
                <!-- Amount Field -->
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">Amount (₹)</label>
                    <input type="number" name="amount" class="form-control" value="{{ expense[4] }}" step="0.01" required>
                </div>

                <!-- Description Field -->
                <div class="col-md-6 mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" required>{{ expense[5] }}</textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit" class="btn btn-warning">Update Expense</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
